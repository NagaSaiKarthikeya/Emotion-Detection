<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceAuth — Emotion Detection</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --beige-50:  #fdf8f2;
    --beige-100: #f5ece0;
    --beige-200: #e8d5bc;
    --beige-300: #d4b896;
    --blue-400:  #6b8cba;
    --blue-500:  #4f72a6;
    --blue-600:  #3a5a8c;
    --blue-700:  #2c4570;
    --text-dark: #1e2d3d;
    --text-mid:  #4a5a6b;
    --text-soft: #8a9aab;
    --success:   #5a9e7a;
    --error:     #c0614a;
    --shadow-sm: 0 2px 8px rgba(42,70,110,0.08);
    --shadow-md: 0 8px 32px rgba(42,70,110,0.14);
    --shadow-lg: 0 20px 60px rgba(42,70,110,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--beige-50);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Atmospheric background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 20%, rgba(107,140,186,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 80%, rgba(212,184,150,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 50% 50%, rgba(107,140,186,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Decorative floating shapes */
  .bg-shape {
    position: fixed;
    border-radius: 50%;
    opacity: 0.07;
    pointer-events: none;
    animation: drift 18s ease-in-out infinite;
  }
  .bg-shape:nth-child(1) { width: 400px; height: 400px; background: var(--blue-500); top: -100px; right: -80px; animation-delay: 0s; }
  .bg-shape:nth-child(2) { width: 250px; height: 250px; background: var(--beige-300); bottom: -60px; left: -40px; animation-delay: -6s; }
  .bg-shape:nth-child(3) { width: 150px; height: 150px; background: var(--blue-400); top: 40%; left: 5%; animation-delay: -12s; }

  @keyframes drift {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-20px) scale(1.04); }
  }

  .card {
    position: relative;
    background: rgba(255, 252, 248, 0.92);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(212,184,150,0.4);
    border-radius: 28px;
    padding: 52px 48px 44px;
    width: 440px;
    box-shadow: var(--shadow-lg);
    animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card-header {
    text-align: center;
    margin-bottom: 36px;
  }

  .logo-mark {
    width: 56px; height: 56px;
    background: linear-gradient(135deg, var(--blue-500), var(--blue-700));
    border-radius: 16px;
    margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(79,114,166,0.35);
  }

  .logo-mark svg { width: 28px; height: 28px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; }

  h2 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    color: var(--text-dark);
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .subtitle {
    font-size: 13.5px;
    color: var(--text-soft);
    margin-top: 6px;
    font-weight: 300;
    letter-spacing: 0.2px;
  }

  .field-group {
    margin-bottom: 18px;
    position: relative;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-mid);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }

  input {
    width: 100%;
    padding: 14px 48px 14px 18px;
    background: var(--beige-50);
    border: 1.5px solid var(--beige-200);
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--text-dark);
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
  }

  input:focus {
    border-color: var(--blue-400);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(107,140,186,0.12);
  }

  input.voice-active {
    border-color: var(--blue-500);
    background: rgba(107,140,186,0.06);
    animation: voicePulse 1s ease-in-out infinite;
  }

  @keyframes voicePulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(107,140,186,0.3); }
    50%       { box-shadow: 0 0 0 6px rgba(107,140,186,0); }
  }

  .eye-btn {
    position: absolute;
    right: 14px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-soft);
    font-size: 17px;
    line-height: 1;
    transition: color 0.2s;
    padding: 4px;
  }
  .eye-btn:hover { color: var(--blue-500); }

  .error-text {
    font-size: 13px;
    color: var(--error);
    margin-top: 6px;
    min-height: 18px;
    font-weight: 400;
    display: flex;
    align-items: center;
    gap: 5px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  .btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 26px;
  }

  button.btn {
    padding: 14px;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.22s;
    border: none;
    letter-spacing: 0.2px;
  }

  .btn-cancel {
    background: var(--beige-100);
    color: var(--text-mid);
    border: 1.5px solid var(--beige-200);
  }
  .btn-cancel:hover { background: var(--beige-200); }

  .btn-ok {
    background: linear-gradient(135deg, var(--blue-500), var(--blue-700));
    color: white;
    box-shadow: 0 4px 14px rgba(79,114,166,0.35);
  }
  .btn-ok:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,114,166,0.45); }
  .btn-ok:active { transform: none; }

  /* Mic status bar */
  .mic-bar {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--beige-100);
    border: 1px solid var(--beige-200);
    border-radius: 14px;
    padding: 12px 16px;
  }

  .mic-icon {
    width: 36px; height: 36px;
    background: var(--blue-500);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    position: relative;
    transition: background 0.3s;
  }

  .mic-icon.listening {
    background: var(--blue-600);
    animation: micPop 1.4s ease-in-out infinite;
  }

  @keyframes micPop {
    0%, 100% { box-shadow: 0 0 0 0 rgba(79,114,166,0.5); }
    50% { box-shadow: 0 0 0 10px rgba(79,114,166,0); }
  }

  .mic-icon svg { width: 17px; height: 17px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; }

  .mic-text { font-size: 13px; color: var(--text-mid); line-height: 1.4; }
  .mic-text strong { display: block; font-size: 12px; color: var(--text-soft); font-weight: 400; margin-top: 2px; }

  /* Voice transcript toast */
  .transcript-toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--blue-700);
    color: white;
    padding: 10px 22px;
    border-radius: 100px;
    font-size: 13.5px;
    font-weight: 400;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    white-space: nowrap;
    z-index: 999;
  }

  .transcript-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Device badge */
  .device-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    color: var(--text-soft);
    background: var(--beige-100);
    border: 1px solid var(--beige-200);
    border-radius: 100px;
    padding: 4px 10px;
    margin-top: 14px;
  }
  .device-badge span { width: 6px; height: 6px; background: var(--success); border-radius: 50%; display: inline-block; }

  .hint-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 16px;
  }

  .pill {
    font-size: 11px;
    background: rgba(107,140,186,0.1);
    color: var(--blue-600);
    border: 1px solid rgba(107,140,186,0.2);
    border-radius: 100px;
    padding: 4px 12px;
    font-weight: 500;
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>

<div class="bg-shape"></div>
<div class="bg-shape"></div>
<div class="bg-shape"></div>

<div class="card">
  <div class="card-header">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 10-16 0"/><circle cx="18" cy="18" r="3"/><path d="M16 18h2m1-1v2"/></svg>
    </div>
    <h2>VoiceAuth</h2>
    <p class="subtitle">Hands-free · Emotion Detection System</p>
  </div>

  <div class="field-group">
    <label>Username</label>
    <div class="input-wrap">
      <input type="text" id="username" placeholder="Say 'username John'" autocomplete="off" />
    </div>
  </div>

  <div class="field-group">
    <label>Password</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="Say 'password 1234'" autocomplete="new-password" />
      <button class="eye-btn" id="togglePassword" aria-label="Toggle password">👁</button>
    </div>
  </div>

  <p id="error-message" class="error-text"></p>

  <div class="btn-row">
    <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
    <button class="btn btn-ok" id="okBtn">Sign In</button>
  </div>

  <div class="mic-bar">
    <div class="mic-icon listening" id="micIcon">
      <svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M19 11a7 7 0 01-14 0M12 18v4M8 22h8"/></svg>
    </div>
    <div>
      <div class="mic-text" id="micStatus">Listening for voice commands…</div>
      <strong class="mic-text"><span id="lastHeard"></span></strong>
    </div>
  </div>

  <div id="deviceBadge"></div>

  <div class="hint-pills">
    <span class="pill">🎤 "username [name]"</span>
    <span class="pill">🔑 "password [word]"</span>
    <span class="pill">✅ "OK" to login</span>
    <span class="pill">❌ "Cancel" to clear</span>
  </div>
</div>

<div class="transcript-toast" id="toast"></div>

<script>
  const usernameEl = document.getElementById("username");
  const passwordEl = document.getElementById("password");
  const okBtn      = document.getElementById("okBtn");
  const cancelBtn  = document.getElementById("cancelBtn");
  const errorMsg   = document.getElementById("error-message");
  const togglePwd  = document.getElementById("togglePassword");
  const micStatus  = document.getElementById("micStatus");
  const lastHeard  = document.getElementById("lastHeard");
  const micIcon    = document.getElementById("micIcon");
  const toast      = document.getElementById("toast");
  const deviceBadge= document.getElementById("deviceBadge");

  // ─── Utility ────────────────────────────────────────────────
  function showToast(msg, duration = 2200) {
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), duration);
  }

  function setError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.animation = "none";
    requestAnimationFrame(() => errorMsg.style.animation = "");
  }

  function clearFields() {
    usernameEl.value = "";
    passwordEl.value = "";
    setError("");
    showToast("🧹 Fields cleared");
  }

  function flashInput(el) {
    el.classList.add("voice-active");
    setTimeout(() => el.classList.remove("voice-active"), 1800);
  }

  // ─── Device fingerprint ──────────────────────────────────────
  function getDeviceId() {
    let id = localStorage.getItem("device_id");
    if (!id) {
      id = "dev_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
      localStorage.setItem("device_id", id);
    }
    return id;
  }

  const deviceId = getDeviceId();

  // ─── User store ──────────────────────────────────────────────
  // Schema: { username: { password, devices: [deviceId, ...] } }
  function getUsers() {
    return JSON.parse(localStorage.getItem("emo_users") || "{}");
  }
  function saveUsers(u) {
    localStorage.setItem("emo_users", JSON.stringify(u));
  }

  // Device-saved session: if this device has a saved user, go straight in
  function checkDeviceSession() {
    const saved = localStorage.getItem("device_session_" + deviceId);
    if (saved) {
      deviceBadge.innerHTML = `<div class="device-badge"><span></span> Saved session: <b>${saved}</b> — say "OK" to login instantly</div>`;
      usernameEl.value = saved;
      usernameEl.placeholder = "Auto-filled from device";
      showToast(`👤 Welcome back, ${saved}! Say 'password …' then 'OK'`, 3500);
    }
  }

  checkDeviceSession();

  // ─── Login logic ─────────────────────────────────────────────
  function attemptLogin() {
    const u = usernameEl.value.trim();
    const p = passwordEl.value.trim();

    if (!u || !p) {
      setError("⚠️ Please provide both username and password.");
      showToast("Say username and password first");
      return;
    }

    const users = getUsers();

    if (users[u]) {
      // Known user
      if (users[u].password === p) {
        // Correct — register device
        if (!users[u].devices.includes(deviceId)) {
          users[u].devices.push(deviceId);
          saveUsers(users);
        }
        localStorage.setItem("device_session_" + deviceId, u);
        showToast("✅ Welcome, " + u + "! Opening emotion detection…");
        micStatus.textContent = "Login successful!";
        setTimeout(() => window.location.href = "emotion.html", 1200);
      } else {
        // Wrong — tell which field is wrong
        const wrongField = users[u].password === p ? "username" : "password";
        setError(`❌ Incorrect ${users[u].username === u ? "password" : "username"}. Try again or say "add new login".`);
        showToast(`Wrong ${users[u].username === u ? "password" : "username"} — say "add new login" to register fresh`);
      }
    } else {
      // New user — register
      users[u] = { password: p, devices: [deviceId] };
      saveUsers(users);
      localStorage.setItem("device_session_" + deviceId, u);
      showToast("🎉 New account created! Welcome, " + u);
      setTimeout(() => window.location.href = "emotion.html", 1200);
    }
  }

  okBtn.onclick = attemptLogin;

  cancelBtn.onclick = clearFields;

  togglePwd.onclick = () => {
    passwordEl.type = passwordEl.type === "password" ? "text" : "password";
    togglePwd.textContent = passwordEl.type === "password" ? "👁" : "🙈";
  };

  // ─── Voice recognition ───────────────────────────────────────
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

if (SR) {
  const rec = new SR();
  rec.continuous = true;
  rec.interimResults = false;
  rec.lang = "en-US";

  rec.onstart = () => {
    micIcon.classList.add("listening");
    micStatus.textContent = "Listening for voice commands…";
  };

  rec.onend = () => {
    micIcon.classList.remove("listening");
    micStatus.textContent = "Mic restarting…";
    setTimeout(() => {
      try { rec.start(); } catch(e) {}
    }, 500);
  };

  rec.onerror = (e) => {
    if (e.error !== "no-speech") {
      micStatus.textContent = "Mic error: " + e.error;
    }
  };

  rec.onresult = (e) => {
    const raw = e.results[e.results.length - 1][0].transcript.toLowerCase().trim();

    lastHeard.textContent = `Heard: "${raw}"`;
    showToast("🎤 " + raw);

    if (raw.startsWith("username ")) {
      const val = raw.replace("username ", "").trim();
      usernameEl.value = val;
      flashInput(usernameEl);
      micStatus.textContent = "Username set: " + val;

    } else if (raw.startsWith("password ")) {
      const val = raw.replace("password ", "").trim();
      passwordEl.value = val;
      flashInput(passwordEl);
      micStatus.textContent = "Password set ✔";

    } else if (raw === "ok" || raw === "login" || raw === "sign in") {
      attemptLogin();

    } else if (raw === "cancel" || raw === "clear") {
      clearFields();
    }
  };

  rec.start();

} else {
  micStatus.textContent = "⚠️ Speech API not supported in this browser";
  micIcon.classList.remove("listening");
}
</script>
</body>
</html>
